<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5f8">
<title>PakkBevis</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f3f5f8;--card:#fff;--ink:#111d2b;--mute:#44566a;--line:#d7dee7;--accent:#0b5cad;--accent-ink:#fff;
--green:#0b6e4f;--green-bg:#e4f5ed;--amber:#8a5200;--amber-bg:#fff2d6;--red:#a4161a;--red-bg:#fde8e8;--focus:#ffb000;
--gutter:clamp(12px,4vw,28px);--radius:16px;--radius-sm:10px;
--shadow-1:0 1px 2px rgba(17,29,43,.05);--shadow-2:0 6px 18px rgba(17,29,43,.10)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{letter-spacing:-.015em}
#app{max-width:1180px;margin:0 auto;padding:0 var(--gutter) calc(28px + env(safe-area-inset-bottom))}

/* header + navigation */
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:18px 0 12px}
header.top h1{margin:0;font-size:clamp(1.3rem,2.4vw,1.55rem);letter-spacing:.1px}
header.top .tag{margin:2px 0 0;color:var(--mute);font-size:.95rem}
.langs{display:grid;grid-template-columns:repeat(2,56px);gap:6px}
nav.tabs{position:sticky;top:0;z-index:30;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
padding:8px 0;margin:0 calc(-1 * var(--gutter));padding-left:var(--gutter);padding-right:var(--gutter);
background:rgba(243,245,248,.88);background:color-mix(in srgb,var(--bg) 88%,transparent);
-webkit-backdrop-filter:blur(12px) saturate(1.15);backdrop-filter:blur(12px) saturate(1.15);border-bottom:1px solid var(--line)}

/* controls */
button,select,input,textarea{font:inherit;color:inherit}
button{min-height:48px;padding:10px 16px;border-radius:var(--radius-sm);border:2px solid var(--accent);background:#fff;color:var(--accent);cursor:pointer;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button[aria-pressed="true"],button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.tab{flex:1;background:#fff;border-color:var(--line);color:var(--ink)}
button.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.lang{min-width:48px;padding:8px;background:#fff;border-color:var(--line);color:var(--ink)}
button.lang[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.danger{border-color:var(--red);color:var(--red)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button,select,input,textarea,summary{scroll-margin-top:88px}
label{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px}
select,input,textarea{width:100%;min-height:48px;padding:9px 11px;border:2px solid var(--line);border-radius:var(--radius-sm);background:#fff}
textarea{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
:disabled{opacity:.55;cursor:default}

/* surfaces */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(14px,2vw,20px);margin:14px 0;box-shadow:var(--shadow-1)}
.card h2,.card h3{margin:0 0 10px;font-size:clamp(1.05rem,1.7vw,1.2rem)}
.card h3{font-size:1rem}
.card.green{border-left:6px solid var(--green)}
.card.amber{border-left:6px solid var(--amber);background:#fffaf0}
.card.red{border-left:6px solid var(--red);background:#fff7f7}
.head{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:8px}
.head h2{margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>*{flex:1 1 140px;min-width:0}
.row>button{flex:0 1 auto}
.badge{display:inline-block;padding:6px 12px;border-radius:999px;font-weight:700;border:2px solid}
.badge.green{color:var(--green);background:var(--green-bg);border-color:var(--green)}
.badge.amber{color:var(--amber);background:var(--amber-bg);border-color:var(--amber)}
.badge.red{color:var(--red);background:var(--red-bg);border-color:var(--red)}
.msg{margin:10px 0;padding:10px 12px;border-radius:var(--radius-sm);background:#eaf2fb}
.msg.err{background:var(--red-bg);color:var(--red);font-weight:600}
.msg.ok{background:var(--green-bg);color:var(--green);font-weight:600}
.warn{display:block;color:var(--amber);font-weight:700}
.small{font-size:.85rem;color:var(--mute)}
.save{color:var(--green)}

/* pack: top card */
.topcard{padding:clamp(14px,2vw,20px)}
.topcard .toprow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:end}
.topcard .toprow>*{flex:none;min-width:0}
.topcard .small{margin:4px 0 0}

/* result card */
.boxname{font-size:1.4rem;font-weight:800;letter-spacing:-.02em}
.boxname.hero{font-size:clamp(2rem,5vw,2.9rem);line-height:1.05;font-weight:800;margin:4px 0 2px;overflow-wrap:anywhere}
.boxsize{margin:0 0 10px;font-size:clamp(1rem,1.8vw,1.15rem);color:var(--mute);font-weight:600}
.savebar{display:flex;flex-direction:column;gap:2px;margin:0 0 12px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--green-bg);color:var(--green);font-weight:700}
.savebar span{font-weight:500;font-size:.9rem}
dl.m{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
dl.m div{background:#f2f5f9;border-radius:var(--radius-sm);padding:9px 10px}
dl.m dt{font-size:.76rem;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
dl.m dd{margin:0;font-weight:700;font-size:1.05rem;font-variant-numeric:tabular-nums}
dl.m.big{grid-template-columns:repeat(3,1fr);gap:8px}
dl.m.big div{background:#eaf2fb;padding:10px 8px}
dl.m.big dt{font-size:.72rem}
dl.m.big dd{font-size:clamp(1.15rem,2.6vw,1.65rem);letter-spacing:-.02em}

/* result: two-column body on wide screens */
.result-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px 22px}
.result-grid h3{margin-top:0}
.result-side{min-width:0}
@media (min-width:920px){
.result-grid{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr);align-items:start}
.result-side{border-left:1px solid var(--line);padding-left:22px}
}

/* steps */
ul.clean{list-style:none;margin:0;padding:0}
ul.clean li{padding:8px 0;border-bottom:1px solid var(--line)}
ul.clean li:last-child{border-bottom:0}
ol.steps{list-style:none;margin:0;padding:0}
.steps li{padding:0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
label.step,span.step{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 4px;margin:0;font-weight:500;font-size:1.02rem;cursor:pointer;border-radius:var(--radius-sm)}
label.step input{flex:0 0 28px;width:28px;min-height:28px;height:28px;margin:0;accent-color:var(--green)}
label.step .warn{font-size:.95rem}
label.step.done{color:var(--mute);text-decoration:line-through}
span.step.fill{font-weight:700;cursor:default}

/* proof, viz, extras */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{background:#eef1f5;border-radius:999px;padding:5px 11px;font-size:.88rem}
.chips.proof li{background:#f4f7fb;border:1px solid var(--line);font-weight:600}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.layers button{min-width:48px;padding:8px 12px}
.viz{width:100%;max-width:100%;height:auto;display:block;margin:10px 0;background:#fff;border:1px solid var(--line);border-radius:var(--radius-sm)}
.chart{width:100%;max-width:420px;height:auto;display:block}
.legend{font-size:.85rem;color:var(--mute)}
details.more{margin-top:12px}
details.more>summary,details.card>summary{cursor:pointer;min-height:48px;display:flex;align-items:center;font-weight:700}
details.card>summary{padding:2px 0}
.tag-test{font-size:.75rem;background:var(--amber-bg);color:var(--amber);border-radius:var(--radius-sm);padding:2px 7px;margin-left:8px}

/* action bar */
.actionbar{position:sticky;bottom:0;z-index:20;background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);
border-radius:var(--radius);padding:10px;margin:16px 0;box-shadow:0 -6px 20px rgba(17,29,43,.12);bottom:calc(0px + env(safe-area-inset-bottom))}
.actionbar .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
.actionbar .row>button{width:100%;flex:none}
.actionbar .msg{margin:8px 0 0}
@media (min-width:700px){.actionbar .row{grid-template-columns:minmax(0,320px) minmax(0,320px);justify-content:center}}

/* queue + import */
.queue button.qi{display:block;width:100%;text-align:left;margin:6px 0;font-weight:500}
.queue button.qi.fresh{border-color:var(--green);background:var(--green-bg)}

/* manager */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
thead th{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.03em;font-weight:700}
tfoot td{font-weight:800;border-top:2px solid var(--ink)}
.mgr-table thead th:first-child,.mgr-table tbody td:first-child,.mgr-table tfoot td:first-child{position:sticky;left:0;z-index:2;background:var(--card);box-shadow:1px 0 0 var(--line)}
.mgr-head .boxname{font-size:clamp(1.05rem,2vw,1.3rem)}
@media (min-width:1000px){
main.view-leader{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,400px);gap:0 18px;align-items:start}
main.view-leader>.card{grid-column:1 / -1}
main.view-leader>.mgr-chart{grid-column:1}
main.view-leader>.mgr-finder{grid-column:2}
.mgr-chart .chart{max-width:100%}
}

/* self-test + footer */
.st-ok{color:var(--green);font-weight:700}
.st-fail{color:var(--red);font-weight:700}
footer{margin-top:24px;text-align:center;color:var(--mute);font-size:.9rem}
::selection{background:#cfe3f8}

/* quiet micro-interactions: step on hover, press on click */
button,.card,.queue button.qi,.chips li{transition:transform .12s ease,background-color .12s ease,box-shadow .12s ease,border-color .12s ease}
button:active{transform:translateY(1px) scale(.99)}
@media (hover:hover){
button:hover{transform:translateY(-1px)}
button.primary:hover{background:#094a8c}
button.danger:hover{background:var(--red-bg)}
button.tab:hover:not([aria-selected="true"]),button.lang:hover:not([aria-pressed="true"]){background:#eef3f9}
.queue button.qi:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
label.step:hover{background:#f5f8fb}
.viz:hover{box-shadow:var(--shadow-2)}
}
button:disabled{transform:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}button:hover,button:active,.queue button.qi:hover{transform:none}}

/* narrow screens */
@media (max-width:639px){
.topcard .toprow{grid-template-columns:1fr;gap:10px}
}
@media (max-width:520px){
header.top{padding-top:14px}
.card{margin:12px 0}
dl.m.big{grid-template-columns:repeat(3,1fr)}
.boxname.hero{font-size:clamp(1.8rem,9vw,2.3rem)}
.actionbar .row{grid-template-columns:1fr 1fr}
}
@media (max-width:380px){
#app{padding-left:10px;padding-right:10px}
nav.tabs{padding-left:10px;padding-right:10px;margin-left:-10px;margin-right:-10px}
button{padding-left:10px;padding-right:10px}
.actionbar .row{grid-template-columns:1fr}
.boxname.hero{font-size:1.75rem}
dl.m.big dd{font-size:1.1rem}
}

/* packer confirmation line + compact header */
.packer{margin:0 0 8px;font-weight:600;font-size:.95rem}
.packer.wait{color:var(--amber)}
.packer.done{color:var(--green)}
header.top{flex-wrap:nowrap;padding:8px 0 6px}
header.top h1{font-size:1.2rem;line-height:1.1}
header.top .tag{font-size:.8rem}
.langs{gap:4px}
button.lang{min-width:48px;min-height:48px;padding:4px}

.langs{margin-left:auto}
@media (max-width:420px){.topcard .small{display:none}.topcard{padding:8px 10px}.topcard label{margin-bottom:2px}}

/* taste pass: aligned digits, balanced headings, calmer table */
body{font-variant-numeric:tabular-nums}
h1,h2,h3,.savebar strong,.packer{text-wrap:balance}
th{font-weight:600;letter-spacing:.04em}
tbody tr:hover td{background:#f3f7fc}
.card h2{letter-spacing:-.02em}

</style>

  }

  function vizBlock(r, key) {
    var zs = PB.layerZs(r.placements), idx = Math.min(S.layer[key] || 0, zs.length - 1);
    var tabs = h('div', { 'class': 'layers', role: 'group', 'aria-label': t('viz.top') }, zs.map(function (z, i) {
      return h('button', { type: 'button', text: t('viz.layer', { n: i + 1 }), 'aria-pressed': String(i === idx), onclick: function () { S.layer[key] = i; render(); } });
    }));
    var ids = []; r.placements.forEach(function (p) { if (ids.indexOf(p.itemId) < 0) ids.push(p.itemId); });
    var legend = h('ul', { 'class': 'chips' }, ids.map(function (id) {
      var li = h('li', { text: V.label(id) + ' ' + itemName(id) }); li.style.borderLeft = '10px solid ' + V.colorOf(id); return li;
    }));
    return h('div', {}, [h('h3', { text: t('viz.title') }), tabs,
      h('p', { 'class': 'small', text: t('viz.top') + ' – ' + t('viz.layer', { n: idx + 1 }) }),
      V.topView(r.box, r.placements, zs[idx], t('viz.aria')),
      legend, h('p', { 'class': 'legend', text: t('viz.legendFragile') + ' · ' + t('viz.legendEmpty') })]);
  }

  function stepsBlock(r, rec, opts, key) {
    var steps = PB.packSteps(r.placements, { margin: rec.margin });
    var lis = [];
    steps.forEach(function (st) {
      var d = f(st.dims[0]) + '×' + f(st.dims[1]) + '×' + f(st.dims[2]) + (st.rotated ? ', ' + t('steps.rotated') : '');
      var tk = key + ':' + st.n;
      var txt = h('span', {}, [t('steps.item', { n: st.n, item: itemName(st.itemId), dims: d, pos: t('steps.pos', { x: f(st.x), y: f(st.y), z: st.layer }) })]);
      if (st.fragile) txt.appendChild(h('span', { 'class': 'warn', text: '⚠ ' + t('steps.fragile') }));
      var cb = h('input', { type: 'checkbox', checked: !!S.ticks[tk], 'aria-label': t('steps.tick') + ' ' + st.n,
        onchange: function () { S.ticks[tk] = this.checked; this.parentNode.classList.toggle('done', this.checked); } });
      lis.push(h('li', {}, [h('label', { 'class': 'step' + (S.ticks[tk] ? ' done' : '') }, [cb, txt])]));
    });
    if (r.metrics.fillerLitres > 0) lis.push(h('li', {}, [h('span', { 'class': 'step fill', text: t('steps.filler', { l: f(r.metrics.fillerLitres) }) })]));
    return h('div', {}, [h('h3', { text: t('steps.title') }), h('ol', { 'class': 'steps' }, lis)]);
  }

  function whyBlock(rec) {
    var r = rec.recommended, m = r.metrics, base = rec.baseline;
    var text = base ? t('why.text', { box: boxLabel(r.box), size: boxSize(r.box), total: f(m.totalCost), base: f(base.metrics.totalCost), airBefore: f(rec.airBefore), airAfter: f(rec.airAfter) })
      : t('why.textNoBase', { box: boxLabel(r.box), size: boxSize(r.box), total: f(m.totalCost), airAfter: f(rec.airAfter) });
    var kids = [h('p', { text: text })];
    if (rec.reasonCode === 'cheaper_freight_bracket') kids.push(h('p', { text: t('why.smallest', { box: boxLabel(rec.smallest.box), f1: f(rec.smallest.metrics.freightNOK, 0), f2: f(m.freightNOK, 0) }) }));
    kids.push(h('p', { 'class': 'small', text: t('why.verified') }));
    kids.push(h('h3', { text: t('why.rejected') }));
    kids.push(h('ul', { 'class': 'chips' }, rec.rejected.map(function (x) {
      return h('li', { text: x.boxId + ': ' + t('reason.' + x.reason) });
    })));
    return h('div', {}, kids);
  }

  function resetLearning() {
    S.rejects = {}; S.dims = {}; persistRejects(); persistDims(); S.tnp = null; S.tnpManual = false;
    S.learnMsg = { ok: true, text: t('learn.resetDone') }; S.mgrCache = {}; S.mgr = { status: 'idle', best: null, progress: 0 };
    render();
  }
  /* "Passet" = one tap: confirm and, for a queued order, remove it and open the next one. */
  function confirmFit() {
    S.learnMsg = { ok: true, text: t('learn.confirmed') };
    S.okKey = curOrder().id;
    if (S.sel === 'Q' && S.qOrder) {
      var i = -1;
      S.queue.forEach(function (q, k) { if (q.id === S.qOrder.id) i = k; });
      if (i >= 0) S.queue.splice(i, 1);
      var next = S.queue[i] || S.queue[i - 1] || null;
      if (next) S.qOrder = next; else { S.qOrder = null; S.sel = 'O1001'; }
    }
    render();
    window.scrollTo(0, 0);
  }
  function actionBar(lines) {
    var margin = PB.marginFor(S.rejects, lines);
    var kids = [h('div', { 'class': 'row' }, [
      btn('btn.fit', 'primary', confirmFit),
      btn('btn.nofit', 'danger', function () {
        S.rejects = PB.addReject(S.rejects, lines); persistRejects(); S.okKey = null;
        S.learnMsg = { ok: false }; render();
      })
    ])];
    var lm = S.learnMsg;
    if (lm) kids.push(h('p', { 'class': 'msg ok', role: 'status', text: lm.ok ? lm.text : t('learn.applied', { n: f(PB.marginFor(S.rejects, lines)) }) }));
    else if (margin > 0) kids.push(h('p', { 'class': 'msg ok', text: t('learn.applied', { n: f(margin) }) }));
    return h('div', { 'class': 'actionbar' }, kids);
  }

  // ------------------------------------------------------------------ manager view
  function managerRows() {
    return PB.ORDERS.map(function (o) {
      var opts = optsFor(o.lines), s = PB.solve(o.lines, opts), row = { id: o.id, s: s, lines: o.lines, opts: opts };
      if (s.state === 'AMBER_MISSING_DIMS') { row.status = 'AMBER_MISSING_DIMS'; return row; }
      if (s.state === 'RED_CANNOT_PACK') { row.status = 'RED_CANNOT_PACK'; return row; }
      var ps = s.state === 'NEEDS_SPLIT' ? s.split.parcels.map(function (p) { return p.rec; }) : [s.rec];
      var inner = 0, item = 0, kg = 0, fr = 0, tot = 0;
      ps.forEach(function (r) { var m = r.recommended.metrics; inner += m.innerVol; item += m.itemVol; kg += m.chargeableKg; fr += m.freightNOK; tot += m.totalCost; });
      row.box = ps.map(function (r) { return r.recommended.box.id; }).join('+');
      row.air = (inner - item) / inner * 100; row.kg = kg; row.fr = fr; row.tot = tot;
      row.sav = s.state === 'NEEDS_SPLIT' ? null : s.rec.savingsNOK;
      row.before = s.state === 'NEEDS_SPLIT' ? null : s.rec.airBefore;
      row.status = s.state === 'NEEDS_SPLIT' ? (s.split.provisional ? 'AMBER_PROVISIONAL' : 'GREEN_VERIFIED') : s.rec.state;
      row.split = s.state === 'NEEDS_SPLIT';
      return row;
    });
  }

  function viewLeader() {
    var rows = managerRows(), tk = 0, tf = 0, tt = 0, ts = 0;
    var body = rows.map(function (r) {
      var dash = '–';
      if (r.box === undefined) {
        return h('tr', {}, [h('td', { text: r.id }), h('td', { text: dash }), h('td', { text: dash }), h('td', { text: dash }), h('td', { text: dash }), h('td', { text: dash }), h('td', { text: dash }), h('td', {}, [badge(r.status)])]);
      }
      tk += r.kg; tf += r.fr; tt += r.tot; if (r.sav !== null) ts += r.sav;
      return h('tr', {}, [h('td', { text: r.id }), h('td', { text: r.split ? t('result.parcels', { n: r.s.split.parcelCount }) + ' (' + r.box + ')' : r.box }),
        h('td', { text: f(r.air) }), h('td', { text: f(r.kg) }), h('td', { text: f(r.fr, 0) }), h('td', { text: f(r.tot) }),
        h('td', { text: r.sav === null ? dash : f(r.sav), 'class': r.sav > 0 ? 'save' : '' }), h('td', {}, [badge(r.status)])]);
    });
    var heads = ['col.order', 'col.box', 'col.air', 'col.kg', 'col.freight', 'col.total', 'col.savings', 'col.status'];
    var table = h('div', { 'class': 'tablewrap' }, [h('table', {}, [
      h('thead', {}, [h('tr', {}, heads.map(function (k) { return h('th', { scope: 'col', text: t(k) }); }))]),
      h('tbody', {}, body),
      h('tfoot', {}, [h('tr', {}, [h('td', { text: t('mgr.totals') }), h('td', { text: '' }), h('td', { text: '' }), h('td', { text: f(tk) }), h('td', { text: f(tf, 0) }), h('td', { text: f(tt) }), h('td', { text: f(ts) }), h('td', { text: '' })])])
    ])]);
    var chartRows = rows.filter(function (r) { return r.box !== undefined; }).map(function (r) { return { label: r.id, before: r.before === undefined ? null : r.before, after: r.air }; });
    var hl = PB.headline(rows.map(function (r) { return r.s; }));
    return [hl.n ? h('div', { 'class': 'card green mgr-head' }, [h('p', { 'class': 'boxname save', role: 'status',
        text: t('mgr.headline', { nok: f(hl.nok), l: f(hl.litres), n: hl.n }) })]) : null,
      h('div', { 'class': 'card mgr-table' }, [h('h2', { text: t('mgr.title') }), table]),
      h('div', { 'class': 'card mgr-chart' }, [h('h2', { text: t('mgr.chart') }), V.bars(chartRows, { before: t('chart.before'), after: t('chart.after') }, t('mgr.chart'))]),
      finderCard()];
  }

  function finderCard() {
    var m = S.mgr, kids = [h('h2', { text: t('mgr.finder') }), h('p', { 'class': 'small', text: t('mgr.finderHelp') })];
    if (m.status === 'running') kids.push(h('p', { 'class': 'msg', role: 'status', text: t('mgr.calc') + ' ' + Math.round(m.progress * 100) + ' %' }));
    else if (m.status === 'done') {
      if (m.best) kids.push(h('p', { 'class': 'msg ok', role: 'status', text: t('mgr.suggest', { dims: m.best.cand.L + '×' + m.best.cand.W + '×' + m.best.cand.H, nok: f(m.best.savings), l: f(m.best.litres), n: m.best.n }) }));
      else kids.push(h('p', { 'class': 'msg', role: 'status', text: t('mgr.none') }));
    }
    kids.push(btn('mgr.run', 'primary', function () { runFinder(); }, m.status === 'running' ? { disabled: true } : null));
    kids.push(h('p', { 'class': 'small', text: t('mgr.skipped') }));
    return h('div', { 'class': 'card mgr-finder' }, kids);
  }

  function runFinder() {
    var rows = managerRows(), base = [], sig = JSON.stringify([S.dims, S.rejects]);
    rows.forEach(function (r) {
      var tt = PB.solveTotals(r.s);
      if (r.s.state !== 'AMBER_MISSING_DIMS' && tt && r.s.rec.state !== 'AMBER_PROVISIONAL') base.push({ id: r.id, lines: r.lines, opts: r.opts, total: tt.total, litres: tt.litres });
    });
    var cands = PB.candidateBoxes(), i = 0, best = null, t0 = Date.now(), chunk = 10;
    S.mgr = { status: 'running', best: null, progress: 0 };
    render();
    (function step() {
      var end = Math.min(cands.length, i + chunk);
      for (; i < end; i++) {
        var c = cands[i], tot = { savings: 0, litres: 0, n: 0 };
        base.forEach(function (b) {
          var key = sig + '|' + b.id + '|' + c.id, hit = S.mgrCache[key];
          if (!hit) {
            var r = PB.evalCandidate(c, [b]);
            hit = S.mgrCache[key] = r;
          }
          tot.savings += hit.savings; tot.litres += hit.litres; tot.n += hit.n;
        });
        if (tot.savings > 1e-9 && (!best || tot.savings > best.savings + 1e-9 || (Math.abs(tot.savings - best.savings) <= 1e-9 && c.L * c.W * c.H < best.cand.L * best.cand.W * best.cand.H))) {
          best = { cand: c, savings: tot.savings, litres: tot.litres, n: tot.n };
        }
      }
      if (i < cands.length) { S.mgr.progress = i / cands.length; if (S.tab === 'leader') render(); setTimeout(step, 0); }
      else {
        S.mgr = { status: 'done', best: best, progress: 1 };
        window.__pbFinderMs = Date.now() - t0;
        if (S.tab === 'leader') render();
      }
    })();
  }

  // ----------------------------------------------------------------- self-test
  function runTests(heavy) {
    S.st.running = true; render();
    setTimeout(function () {
      S.st.results = T.run(PB, I18N, { heavy: heavy }); S.st.fuzz = heavy; S.st.running = false; render();
    }, 30);
  }
  function viewSelftest() {
    var res = S.st.results || [], pass = res.filter(function (r) { return r.pass; }).length;
    var allOk = res.length > 0 && pass === res.length;
    var kids = [h('h2', { text: t('st.title') }),
      h('p', { id: 'stSummary', 'class': 'msg ' + (allOk ? 'ok' : 'err'), role: 'status', text: t('st.summary', { p: pass, t: res.length }) }),
      S.st.fuzz ? null : h('p', { 'class': 'small', text: t('st.fuzzPending') }),
      h('div', { 'class': 'row' }, [
        btn('st.run', '', function () { runTests(S.st.fuzz); }, S.st.running ? { disabled: true } : null),
        btn('st.runFuzz', 'primary', function () { runTests(true); }, S.st.running ? { disabled: true } : null)]),
      S.st.running ? h('p', { 'class': 'msg', text: t('st.running') }) : null,
      h('ul', { 'class': 'clean', id: 'stList' }, res.map(function (r) {
        return h('li', {}, [h('span', { 'class': r.pass ? 'st-ok' : 'st-fail', text: (r.pass ? t('st.pass') : t('st.fail')) + ' ' }),
          h('span', { text: r.id + ' ' + r.name + ' (' + Math.round(r.ms) + ' ms)' }), r.pass ? null : h('div', { 'class': 'small', text: r.msg })]);
      }))];
    return [h('div', { 'class': 'card' }, kids)];
  }

  // ------------------------------------------------------------------- start
  function init() {
    root = document.getElementById('app');
    S.st.results = T.run(PB, I18N, { heavy: false });
    window.__pb = { S: S, render: render };
    if (!coarse()) S.focusId = 'scan';
    render();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
